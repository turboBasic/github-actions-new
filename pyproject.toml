[project]
name = "turbobasic-github-actions"
version = "0.1.0"
description = "Reusable GitHub Actions workflows and composite actions"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Nothing is published from here.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "commitizen>=4.17",
  "yamllint>=1.35",
  "check-jsonschema>=0.33",
  # The gates read the workflows and actions as structures. Declared rather than taken from
  # yamllint's own dependency tree, which would drop it the day yamllint stopped needing it.
  "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["actions", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
]
ignore = ["E501"] # line length is the formatter's job

[tool.pyright]
include = ["actions", "tests"]
# `tests/capabilities.py` is the one owner of how a workflow is read; pytest reaches it by the test
# file's own directory, and pyright needs the same directory named to resolve the import.
extraPaths = ["tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
