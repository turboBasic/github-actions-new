# zizmor's own config, read by both `mise run lint` and the prek hook.
#
# One reference in this repository may name a ref rather than a hash. `EXEMPT` in
# `tests/test_action_pins.py` names which and says why, and is stricter than this file: it asserts that
# exactly one exists, that it is this owner's, and that its ref is a moving one.
#
# The pattern carries the trailing `/*` because the reference names a path inside this repository, and a
# pattern without it matches the repository root only. Everything else stays hash-pinned, including
# anything else of this owner's.
rules:
  unpinned-uses:
    config:
      policies:
        "turboBasic/github-actions-new/*": ref-pin
        "*": hash-pin
