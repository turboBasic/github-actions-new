# actionlint's own config, read by both `mise run lint` and the prek hook because both run it from
# the repository root.
#
# One rule is narrowed, and it is narrowed because two gates contradict each other. GitHub documents
# `$/.github/workflows/x.yml` as the recommended way to call a reusable workflow in the same
# repository; zizmor's `self-repository` audit demands it; actionlint 1.7.12 — the latest release —
# does not know the form yet and rejects it as malformed. No spelling satisfies both tools, so the
# wrong verdict is the one that goes.
#
# The pattern matches that one message and nothing else, so every genuinely malformed
# reusable-workflow reference is still caught. See docs/technical-debt.md for what clears it.
#
# No `check-jsonschema` hook guards this file, unlike every other config under .github/:
# check-jsonschema ships no built-in schema for it, and a `--schemafile <url>` would put the network
# in `mise run ci`. A mis-keyed entry here fails safe — the ignore stops applying and lint reddens.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'reusable workflow call "\$/'
