name: 🧩 prek-advisory

on:
  workflow_call:
    inputs:
      hook-stage:
        description: >-
          The stage the whole-tree lint fires. Empty is the hook runner's own default stage. Pass the
          same stage you pass to python-ci, or the two runs disagree about which checks apply.
        type: string
        default: ""
      timeout-minutes:
        description: How long the job may run before it is cancelled.
        type: number
        default: 20

permissions: {}

env:
  # One marked comment, found by this marker and edited in place. Without it a second push adds a second
  # comment, and after five pushes nobody reads any of them.
  MARKER: "<!-- prek-advisory -->"

jobs:
  prek-advisory:
    name: prek-advisory
    # Registered in the surface fixture's skip table. Advisory, so not a required gate, so principle VII
    # exempts it by name — a green check here means the lint ran, not that it passed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # the checkout the lint reads
      pull-requests: write # the one comment this capability exists to write
    steps:
      # Depth 1: this lints the tree as it stands, not a range, so no history is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `minimum_release_age` rather than a pinned version: a task-runner release whose tag exists
      # before its assets do breaks every consumer at once, and waiting a day for one costs nothing.
      # A pinned version would go stale; this does not.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 24h

      - name: Pre-flight the tools this capability invokes
        run: |
          missing=()
          command -v uv >/dev/null 2>&1 || missing+=(uv)
          command -v prek >/dev/null 2>&1 || missing+=(prek)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::prek-advisory looked for ${missing[*]} on PATH after installing this repository's pinned tools, and did not find it. Add ${missing[*]} to the [tools] table in mise.toml and commit the change; prek-advisory never pins a version this repository does not control." >&2
            exit 1
          fi

      # Unconditional, and no input governs it — the same arrangement python-ci uses, for the same
      # reason: nobody has ever wanted this cache off.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Setup, so it fails the check. Only the lint's own verdict is advisory; a tree whose lockfile
      # disagrees with its manifest cannot be linted against the environment it claims.
      - name: Install from the lockfile
        run: uv sync --locked

      - id: lint
        name: Lint the whole tree
        env:
          HOOK_STAGE: ${{ inputs.hook-stage }}
        run: |
          # The finding is advisory, so a failing hook must not fail this step. Everything above may.
          # `--show-diff-on-failure`: a hook that rewrites a file reports only its own name otherwise,
          # so acting on the comment would mean reproducing the run locally — which is what reporting
          # it in the pull request exists to save.
          status=0
          if [ -n "$HOOK_STAGE" ]; then
            prek run --show-diff-on-failure --all-files --stage "$HOOK_STAGE" > "$RUNNER_TEMP/findings.txt" 2>&1 || status=$?
          else
            prek run --show-diff-on-failure --all-files > "$RUNNER_TEMP/findings.txt" 2>&1 || status=$?
          fi
          cat "$RUNNER_TEMP/findings.txt"
          printf 'clean=%s\n' "$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report the finding once, in place
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLEAN: ${{ steps.lint.outputs.clean }}
        run: |
          {
            printf '%s\n\n' "$MARKER"
            printf '## Whole-tree lint\n\n'
            if [ "$CLEAN" = true ]; then
              printf 'Clean across the whole tree.\n'
            else
              printf 'Findings outside the changed set — advisory, so this check is green either way.\n\n'
              printf '```text\n'
              cat "$RUNNER_TEMP/findings.txt"
              printf '\n```\n'
            fi
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$CLEAN" = true ] || echo "::warning::the whole-tree lint found something the changed-set lint would not have. See the pull request comment."

          # jq builds the payload so a finding holding quotes or newlines cannot break the request.
          jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' > "$RUNNER_TEMP/payload.json"
          existing=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq 'map(select(.body | contains(env.MARKER))) | .[0].id // ""')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" --input "$RUNNER_TEMP/payload.json" > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/payload.json" > /dev/null
          fi
