name: 🌜 advisory

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The job id composes the first half of the context: `advisory / prek-advisory`. Do not require it in
  # a ruleset — it reports green whether or not the lint found anything, which is the point.
  advisory:
    permissions:
      contents: read # the capability checks this tree out to lint it
      pull-requests: write # the one comment it edits in place
    uses: $/.github/workflows/prek-advisory.yml
