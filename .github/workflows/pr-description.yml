name: pr-description

on:
  workflow_call:
    inputs:
      template-path:
        description: The template whose two substitution points are filled in.
        type: string
        default: .github/PULL_REQUEST_TEMPLATE.md
      timeout-minutes:
        description: How long the job may run before it is cancelled.
        type: number
        default: 5

# A caller identifies nothing — not the pull request, not the repository, not the commit range, not a
# token. All of it is already in the run, and every one of those as an input is a value a call site can
# get wrong. The shallow checkout in particular is removed rather than documented: no consumer writes
# it, so no consumer can get its depth wrong.
permissions: {}

jobs:
  pr-description:
    name: pr-description
    # Registered in the surface fixture's skip table: on any other event there is no body to write.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # the full-history checkout this capability owns
      pull-requests: write # writing the body it rendered
    steps:
      # Full history, and the capability's own: the range runs from the base commit to the head one,
      # and a shallow clone has fetched neither end.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the commits in the range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Oldest first, because that is the order the work happened in. Messages hold newlines, so
          # they are separated by a record separator and reach the renderer as a file rather than as
          # arguments — a commit message is text whoever opened the pull request chose.
          git log --format=%B%x1e --reverse "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/messages"

      # python3 is on every ubuntu runner, so the consumer needs no language or package-manager setup
      # step of its own and pins nothing for this capability.
      - name: Render the body from those commits
        env:
          MESSAGES: ${{ runner.temp }}/messages
          TEMPLATE: ${{ inputs.template-path }}
          BODY: ${{ runner.temp }}/body.md
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          RECORD = "\x1e"
          SUMMARY = "<!-- pr-description:summary -->"
          CHANGES = "<!-- pr-description:changes -->"
          # An empty range leaves prompts that render away rather than blank sections. A heading with
          # nothing under it reads as a section somebody forgot to write.
          NOTHING_YET = "<!-- Nothing in the range yet. This fills in when the branch has commits. -->"

          template_path = pathlib.Path(os.environ["TEMPLATE"])
          if not template_path.is_file():
              raise SystemExit(
                  f"::error::pr-description found no template at {template_path}. Point template-path "
                  "at one, or add the file; it needs both substitution points below."
              )
          template = template_path.read_text(encoding="utf-8")
          missing = [marker for marker in (SUMMARY, CHANGES) if marker not in template]
          if missing:
              raise SystemExit(
                  f"::error::the template at {template_path} has no {' or '.join(missing)} in it. "
                  "Add each on a line of its own where the rendered list belongs; both are HTML "
                  "comments, so they render away until this capability fills them."
              )

          raw = pathlib.Path(os.environ["MESSAGES"]).read_text(encoding="utf-8")
          messages = [m.strip() for m in raw.split(RECORD) if m.strip()]


          def subject(message: str) -> str:
              return message.partition("\n")[0].strip()


          def item(message: str) -> str:
              # One list item per commit, its body's paragraphs indented underneath so the breaks
              # survive and the commit stays the unit the reader scans.
              lines = [f"- {subject(message)}"]
              body = message.partition("\n")[2].strip()
              for paragraph in (p.strip() for p in body.split("\n\n")):
                  if paragraph:
                      lines.append("")
                      lines += [f"  {line}" for line in paragraph.splitlines()]
              return "\n".join(lines)


          summary = "\n".join(f"- {subject(m)}" for m in messages) or NOTHING_YET
          changes = "\n\n".join(item(m) for m in messages) or NOTHING_YET
          rendered = template.replace(SUMMARY, summary).replace(CHANGES, changes)
          pathlib.Path(os.environ["BODY"]).write_text(rendered, encoding="utf-8")
          PY

      - name: Write it to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/body.md"
