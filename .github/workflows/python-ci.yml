name: python-ci

on:
  workflow_call:
    inputs:
      run-lint:
        description: >-
          Run the lint stage. Off stops every kind of linting this capability performs, the
          changed-files lint included.
        type: boolean
        default: true
      run-typecheck:
        description: Run the typecheck stage.
        type: boolean
        default: true
      run-tests:
        description: Run the test stage.
        type: boolean
        default: true
      lint-task:
        description: The task this repository's own task runner is asked to run for the lint stage.
        type: string
        default: lint
      typecheck-task:
        description: The task run for the typecheck stage.
        type: string
        default: typecheck
      test-task:
        description: The task run for the test stage.
        type: string
        default: test
      lint-changed-only:
        description: >-
          On a pull request, lint the changed set through the hook runner instead of running the
          lint task. A pull request can then pass while the tree is broken, and prek-advisory is
          what compensates.
        type: boolean
        default: false
      hook-stage:
        description: >-
          The stage the changed-files lint fires. Empty is the hook runner's own default stage, so a
          repository holding its slow hooks back for a later stage must name that stage here or
          those hooks never run on a pull request.
        type: string
        default: ""
      timeout-minutes:
        description: How long the job may run before it is cancelled.
        type: number
        default: 20

# Nothing at workflow level, so the job below is the only thing that names a scope — and a caller
# reading the diff sees the whole demand in one place.
permissions: {}

jobs:
  python-ci:
    name: python-ci
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # the checkout below; no step here writes anywhere
    steps:
      # Full history unconditionally: the changed-files lint diffs against the pull request's base
      # commit, and a shallow clone has not fetched it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs what the calling repository's own [tools] table pins, and nothing this capability
      # chose for it — which is the whole reason a local verdict and this one agree.
      #
      # `minimum_release_age` rather than a pinned version: a task-runner release whose tag exists
      # before its assets do breaks every consumer at once, and waiting a day for one costs nothing.
      # A pinned version would go stale; this does not.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 24h

      - name: Pre-flight the tools this capability invokes
        env:
          NEEDS_HOOK_RUNNER: ${{ inputs.run-lint && inputs.lint-changed-only }}
        run: |
          missing=()
          command -v uv >/dev/null 2>&1 || missing+=(uv)
          if [ "$NEEDS_HOOK_RUNNER" = true ]; then
            command -v prek >/dev/null 2>&1 || missing+=(prek)
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::python-ci looked for ${missing[*]} on PATH after installing this repository's pinned tools, and did not find it. Add ${missing[*]} to the [tools] table in mise.toml and commit the change; python-ci never pins a version this repository does not control." >&2
            exit 1
          fi

      # Unconditional, and no input governs it: a cache nobody has ever wanted off is not a choice
      # a call site should have to make.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Before any stage, and not switchable: a Python repository whose lockfile disagrees with its
      # manifest has no verdict to give, whichever stages are on.
      - id: lockfile
        name: Install from the lockfile
        run: uv sync --locked

      - id: lint
        name: Lint
        if: inputs.run-lint && !(inputs.lint-changed-only && github.event_name == 'pull_request')
        env:
          TASK: ${{ inputs.lint-task }}
        run: mise run "$TASK"

      - id: lint-changed
        name: Lint the changed set
        if: inputs.run-lint && inputs.lint-changed-only && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOOK_STAGE: ${{ inputs.hook-stage }}
        run: |
          if [ -n "$HOOK_STAGE" ]; then
            prek run --stage "$HOOK_STAGE" --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
          else
            prek run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
          fi

      - id: typecheck
        name: Typecheck
        if: inputs.run-typecheck
        env:
          TASK: ${{ inputs.typecheck-task }}
        run: mise run "$TASK"

      - id: tests
        name: Test
        if: inputs.run-tests
        env:
          TASK: ${{ inputs.test-task }}
        run: mise run "$TASK"
