name: describe-pr

# `opened` alone, and deliberately not `synchronize`. Rewriting the body on every push would discard
# whatever a human typed into it since — and the body is the one place they explain why, which no
# renderer can reconstruct from commits.
on:
  pull_request:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The job id composes the first half of the required context: `describe / pr-description`.
  describe:
    permissions:
      contents: read # the capability owns its own full-history checkout
      pull-requests: write # it writes the body it rendered
    uses: $/.github/workflows/pr-description.yml
