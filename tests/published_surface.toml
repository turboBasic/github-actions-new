# The committed published surface: one table per capability, keyed by the capability's own file
# stem. `test_published_surface.py` asserts the tree matches this file exactly — a capability here
# that the tree lacks fails, and a capability in the tree that is missing here fails too.
#
# This is principle IV's gate. Renaming a check, adding an input or raising a permission are all
# one-word edits that read as cosmetic in review and cannot be diagnosed from a consumer's side; each
# now arrives as a deliberate diff to this file as well.
#
# Fields:
#
#   kind                "workflow" or "action". A workflow composes check names; an action does not.
#   published           false marks internal surface carrying no stability promise. An unpublished
#                       capability's inputs are not compared — nothing outside this repository names
#                       them.
#   check_name          the called jobs' names, which are the second half of what a consumer requires
#                       in a ruleset. Absent for an action. A list rather than a string, because one
#                       capability publishes two jobs and so two required contexts.
#   inputs              every declared input, by name. Names only: a default stated here would be a
#                       second owner of a fact the capability YAML already owns.
#   permissions         scope to level, as a caller must grant it for the run to *start*. Validated
#                       before any job exists, so a shortfall yields no job and no log — which is why
#                       the demand is compared surface and not merely documented.
#   tool_prerequisites  tools the capability invokes that the consumer's own configuration must pin.
#                       Empty when the capability provisions its own.
#   skips_under         every event-conditional job-level `if:`, as `{ jobs, event, reason }`. One
#                       entry may cover several jobs that skip for the same reason; `jobs` is what
#                       makes the gate per-job, since a skipped job reports success and an unreasoned
#                       skip is a required check that passes without reading anything.
#
# No capability exists yet. Each row arrives in the same change as the capability it describes.
